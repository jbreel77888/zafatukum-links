{% extends "users/auth_base.html" %}
{% block form_block %}
<form method="POST" novalidate>
  {% csrf_token %}

  <div class="form-group">
    <label>اسم المستخدم (للولوج)</label>
    <input type="text" name="username" class="form-input" value="{{ form.username.value|default:'' }}" required>
  </div>

  <div class="form-group">
    <label>اسم الفنان أو الشركة</label>
    <input type="text" name="display_name" class="form-input" value="{{ form.display_name.value|default:'' }}" required>
  </div>

  <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input type="email" name="email" class="form-input" value="{{ form.email.value|default:'' }}" required>
  </div>

  <div class="form-group">
    <label>رقم الهاتف</label>
    <input type="tel" name="phone" class="form-input" value="{{ form.phone.value|default:'' }}">
  </div>

  <div class="form-group">
    <label>كلمة المرور</label>
    <div class="password-input">
      <input type="password" name="password1" id="registerPassword" class="form-input" required>
      <button type="button" class="toggle-password" onclick="togglePassword('registerPassword')">👁</button>
    </div>
  </div>

  <div class="form-group">
    <label>تأكيد كلمة المرور</label>
    <div class="password-input">
      <input type="password" name="password2" id="confirmPassword" class="form-input" required>
      <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button>
    </div>
  </div>

  <button type="submit" class="auth-btn">إنشاء الحساب</button>
</form>

<div class="terms" style="text-align:center; margin-top:16px; font-size:12px; color:#666;">
  بالتسجيل، أنت توافق على
  <a href="#" style="color:#667eea; text-decoration:none;">شروط الخدمة</a> و
  <a href="#" style="color:#667eea; text-decoration:none;">سياسة الخصوصية</a>
</div>
{% endblock %}
