<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>زفاتكم | زفات المملكة</title>

  <!-- خط عربي حديث -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
  font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; 
  display:flex; 
  align-items:center; 
  justify-content:center;
  position:relative; 
  overflow: auto; /* بدل hidden */
  padding: 20px; /* يعطي مساحة لل scroll */
}
    .background-animation { position:absolute; inset:0; z-index:-1; }
    .floating-shapes { position:absolute; inset:0; }
    .shape { position:absolute; border-radius:50%; animation:float 6s ease-in-out infinite; opacity:.1; }
    .shape1 { width:80px; height:80px; background:#fff; top:20%; left:20%; animation-delay:0s; }
    .shape2 { width:120px; height:120px; background:#ff6b6b; top:60%; right:30%; animation-delay:-2s; }
    .shape3 { width:60px; height:60px; background:#4ecdc4; bottom:30%; left:10%; animation-delay:-4s; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 33%{transform:translateY(-30px) rotate(120deg)} 66%{transform:translateY(15px) rotate(240deg)} }

    .auth-container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius:24px; 
  box-shadow:0 25px 50px rgba(0,0,0,.15);
  width:100%; 
  max-width: 480px; 
  padding:40px; 
  position:relative;
  border:1px solid rgba(255,255,255,.2);
  max-height: 90vh; /* يحد أقصى ارتفاع */
  overflow-y: auto; /* Scroll رأسي للـ container إذا زاد المحتوى */
}
    .logo { text-align:center; margin-bottom:32px; }
    .logo h1 {
      font-size: 30px; font-weight:800; letter-spacing:.3px; line-height:1.2;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:6px;
    }
    .logo p { color:#666; font-size:14px; font-weight:600; }

    .auth-tabs { display:flex; background:#f8f9fa; border-radius:12px; padding:6px; margin-bottom:24px; gap:6px; }
    .tab-btn { flex:1; padding:12px; background:transparent; border:none; border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; transition:.25s; color:#666; text-decoration:none; text-align:center; display:block; }
    .tab-btn.active { background: linear-gradient(135deg,#667eea,#764ba2); color:#fff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(102,126,234,.3); }

    .form-group { margin-bottom:16px; }
    label { display:block; margin-bottom:8px; color:#333; font-weight:700; font-size:14px; }
    .form-input {
      width:100%; padding:14px 16px; border:2px solid #e1e8ed; border-radius:12px;
      font-size:16px; transition:.25s; background:#fafbfc;
    }
    .form-input:focus {
      outline:none; border-color:#667eea; background:#fff; box-shadow:0 0 0 3px rgba(102,126,234,.1);
      transform:translateY(-1px);
    }
    .password-input { position:relative; }
    .toggle-password {
      position:absolute; left:16px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:#666; font-size:18px;
    }
    .remember-forgot {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:14px;
    }
    .checkbox-container { display:flex; align-items:center; gap:8px; }
    .forgot-link { color:#667eea; text-decoration:none; font-weight:700; }
    .forgot-link:hover { text-decoration:underline; }

    .auth-btn {
      width:100%; padding:16px; background: linear-gradient(135deg,#667eea,#764ba2);
      color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer; transition:.25s; position:relative; overflow:hidden;
    }
    .auth-btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(102,126,234,.3); }
    .divider { position:relative; text-align:center; margin:24px 0; color:#666; font-size:14px; }
    .divider::before { content:''; position:absolute; top:50%; left:0; right:0; height:1px; background:#e1e8ed; }
    .divider span { background: rgba(255,255,255,.95); padding:0 16px; }

    .alert {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color:#fff; padding:12px 16px; border-radius:12px; margin-bottom:16px; text-align:center; font-weight:800;
    }
    .alert-error { background: linear-gradient(135deg, #ef4444, #dc2626); }

    @media (max-width: 480px) {
      .auth-container { margin:20px; padding:28px 22px; }
      .logo h1 { font-size:26px; }
    }
  </style>
</head>
<body>
  <div class="background-animation">
    <div class="floating-shapes">
      <div class="shape shape1"></div>
      <div class="shape shape2"></div>
      <div class="shape shape3"></div>
    </div>
  </div>

  <div class="auth-container">
    <div class="logo">
      <h1>زفاتكم | زفات المملكة</h1>
      <p>منصة التوزيع الموسيقي وإدارة الحقوق</p>
    </div>

    <!-- رسائل Django -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <div class="auth-tabs">
      <a href="{% url 'login' %}" class="tab-btn {% if tab == 'login' %}active{% endif %}">تسجيل الدخول</a>
      <a href="{% url 'register' %}" class="tab-btn {% if tab == 'register' %}active{% endif %}">حساب جديد</a>
    </div>

    {% block form_block %}{% endblock %}
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const btn = input?.parentElement?.querySelector('.toggle-password');
      if (!input) return;
      if (input.type === 'password') { input.type = 'text'; if(btn) btn.textContent = '🙈'; }
      else { input.type = 'password'; if(btn) btn.textContent = '👁'; }
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.form-input').forEach(el => {
        el.addEventListener('focus', () => el.style.transform = 'translateY(-2px)');
        el.addEventListener('blur', () => el.style.transform = 'translateY(0)');
      });
    });
  </script>
</body>
</html>
