{% extends "users/auth_base.html" %}
{% block form_block %}
<form method="POST" novalidate>
  {% csrf_token %}
  <div class="form-group">
    <label>البريد الإلكتروني أو اسم المستخدم</label>
    <input type="text" name="username_or_email" class="form-input" value="{{ form.username_or_email.value|default:'' }}" required>
  </div>

  <div class="form-group">
    <label>كلمة المرور</label>
    <div class="password-input">
      <input type="password" name="password" id="loginPassword" class="form-input" required>
      <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁</button>
    </div>
  </div>

  <div class="remember-forgot">
    <div class="checkbox-container">
      <!-- يمكنك ربط "تذكرني" لاحقًا عبر جلسات أطول -->
      <input type="checkbox" disabled>
      <label>تذكرني</label>
    </div>
    <a class="forgot-link" href="#">نسيت كلمة المرور؟</a>
  </div>

  <button type="submit" class="auth-btn">دخول</button>
</form>

<div class="divider"><span>أو</span></div>

<div class="social-login" style="display:flex; gap:12px;">
  <button class="auth-btn" type="button" style="padding:12px; font-size:14px;">تسجيل عبر Google (لاحقًا)</button>
</div>
{% endblock %}
